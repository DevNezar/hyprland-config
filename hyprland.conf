monitor = eDP-1, 1920x1080@60.03, 0x0, 1.33
monitor = HDMI-A-2, 1920x1080@60.00, 0x0, 1, mirror, eDP-1
xwayland {
	force_zero_scaling=true
}

# Variables
$terminal = kitty
$fileManager = nautilus
$menu = wofi

# Environment Variables
env = XCURSOR_SIZE,6
env = HYPRCURSOR_SIZE,6

# Visiuals
general {
    gaps_in = 3
    gaps_out = 10

    border_size = 3

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 1

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = no, please :(

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

dwindle {
    preserve_split = true # You probably want this
}

master {
    new_status = master
}


misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

# Input config
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 0

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
    	#disable_while_typing = false
        natural_scroll = true
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


# KeyBinds

bind = SUPER, Return, exec, $terminal
bind = SUPER, C, killactive,
bind = SUPER, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = SUPER, E, exec, $fileManager
bind = SUPER, P, pseudo, # dwindle
bind = SUPER, J, layoutmsg, togglesplit # dwindle

# Move focus with mainMod + arrow keys
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Scroll through existing workspaces with mainMod + scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = mako
exec-once = /home/nezar/.config/hypr/random-wallpaper.sh
exec-once = swaybg -i ~/wallpaper.png #-m tile
exec-once = waybar
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = firefox-developer-edition

bind = SUPER, F, fullscreen
bind = SUPER, SPACE, exec, wofi --show drun
bind = SUPER, C, exec, ydotool key ctrl+c
bind = SUPER, V, exec, ydotool key ctrl+v
bind = SUPER ALT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = SUPER, W, killactive
bind = SUPER, T, togglefloating
bind = SUPER, B, exec, pgrep waybar && pkill waybar || waybar &
bind = SUPER, A, exec, grim -g "$(slurp)" - | wl-copy --type image/png

bind = SUPER, Z, exec, /home/nezar/.config/hypr/random-wallpaper.sh

binde = SUPER SHIFT, left, resizeactive, -10 0
binde = SUPER SHIFT, right, resizeactive, 10 0
binde = SUPER SHIFT, up, resizeactive, 0 -10
binde = SUPER SHIFT, down, resizeactive, 0 10

bind = SUPER, V, togglefloating,

# Locking Computer(HyprLock)
bind = SUPER, L, exec, hyprlock

# Lock before sleep(suspen)
exec-once = hypridle
bindl=,switch:off:Lid Switch, exec,hyprlock

# Larpmaxxing
bind = SUPER Ctrl, L, exec, kitty --start-as=fullscreen ~/larp.sh

# Workspaces within environment
bind = SUPER, 1, exec, ~/.config/hypr/scripts/go_to_ws.sh 1
bind = SUPER, 2, exec, ~/.config/hypr/scripts/go_to_ws.sh 2
bind = SUPER, 3, exec, ~/.config/hypr/scripts/go_to_ws.sh 3
bind = SUPER, 4, exec, ~/.config/hypr/scripts/go_to_ws.sh 4
bind = SUPER, 5, exec, ~/.config/hypr/scripts/go_to_ws.sh 5
bind = SUPER, 6, exec, ~/.config/hypr/scripts/go_to_ws.sh 6
bind = SUPER, 7, exec, ~/.config/hypr/scripts/go_to_ws.sh 7
bind = SUPER, 8, exec, ~/.config/hypr/scripts/go_to_ws.sh 8
bind = SUPER, 9, exec, ~/.config/hypr/scripts/go_to_ws.sh 9
bind = SUPER, 0, exec, ~/.config/hypr/scripts/go_to_ws.sh 10

# Switch environment
bind = SUPER CTRL, 1, exec, ~/.config/hypr/scripts/go_to_env.sh 1
bind = SUPER CTRL, 2, exec, ~/.config/hypr/scripts/go_to_env.sh 2
bind = SUPER CTRL, 3, exec, ~/.config/hypr/scripts/go_to_env.sh 3

# Move windows
bind = SUPER SHIFT, 1, exec, ~/.config/hypr/scripts/move_to_ws.sh 1
bind = SUPER SHIFT, 2, exec, ~/.config/hypr/scripts/move_to_ws.sh 2
bind = SUPER SHIFT, 3, exec, ~/.config/hypr/scripts/move_to_ws.sh 3
bind = SUPER SHIFT, 4, exec, ~/.config/hypr/scripts/move_to_ws.sh 4
bind = SUPER SHIFT, 5, exec, ~/.config/hypr/scripts/move_to_ws.sh 5
bind = SUPER SHIFT, 6, exec, ~/.config/hypr/scripts/move_to_ws.sh 6
bind = SUPER SHIFT, 7, exec, ~/.config/hypr/scripts/move_to_ws.sh 7
bind = SUPER SHIFT, 8, exec, ~/.config/hypr/scripts/move_to_ws.sh 8
bind = SUPER SHIFT, 9, exec, ~/.config/hypr/scripts/move_to_ws.sh 9
bind = SUPER SHIFT, 0, exec, ~/.config/hypr/scripts/move_to_ws.sh 10

bind = SUPER SHIFT CTRL, 1, exec, ~/.config/hypr/scripts/move_to_env.sh 1
bind = SUPER SHIFT CTRL, 2, exec, ~/.config/hypr/scripts/move_to_env.sh 2
bind = SUPER SHIFT CTRL, 3, exec, ~/.config/hypr/scripts/move_to_env.sh 3

# Core environment injection on launch
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

binde = SUPER, equal, exec, ~/.config/hypr/zoom.sh +0.25
binde = SUPER, minus, exec, ~/.config/hypr/zoom.sh -0.25
