general {
    hide_cursor = true
    ignore_empty_input = true
    screencopy_mode = 1 # GPU accelerated
}

animations {
    enable = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
}

# Input
input-field {
    monitor =
    size = 50, 50
    outline_thickness = 3
    outer_color = rgb(151515)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
    
    hide_input = true
}

# Username
label {
    monitor =
    text = Greetings, $USER
    font_size = 82
    position = 0, 256
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 64
    position = 0, 80
    halign = center
    valign = center
}

# Battery
label {
    monitor =
    text = cmd[update:30000] /home/nezar/.config/hypr/scripts/batt.sh
    color = rgba(255, 255, 255, 0.85)
    font_size = 82
    font_family = FiraCode Nerd Font
    valign = bottom
}


